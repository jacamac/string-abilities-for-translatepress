name: Release

# Triggers on a version tag: git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04  # pinned; move to a newer image deliberately

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: none

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Check tag matches the committed version
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: bin/check-version.sh "$VERSION"

      # git archive honours export-ignore in .gitattributes: no tests, docs,
      # dev config or dev dependencies in the zip.
      - name: Build zip
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          mkdir -p /tmp/build
          git archive --format=zip --prefix=string-abilities-for-translatepress/ \
            -o "/tmp/build/string-abilities-for-translatepress-${VERSION}.zip" HEAD

      - name: Smoke-test built zip
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          unzip -q "/tmp/build/string-abilities-for-translatepress-${VERSION}.zip" -d /tmp/smoke
          cd /tmp/smoke/string-abilities-for-translatepress
          find . -name '*.php' -print0 | xargs -0 -n1 php -l
          grep -q "Plugin Name:" string-abilities-for-translatepress.php
          test ! -e tests && test ! -e docs && test ! -e .github && test ! -e composer.json
          echo "Smoke test passed"

      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "::error::No CHANGELOG.md section for ${VERSION}"
            exit 1
          fi

      - name: Create GitHub Release and upload zip
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: "Release v${{ steps.version.outputs.VERSION }}"
          body_path: /tmp/release-notes.md
          files: /tmp/build/string-abilities-for-translatepress-${{ steps.version.outputs.VERSION }}.zip
          draft: false
          prerelease: false
